name: Deploy Backend to K8s

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:latest

      - name: Deploy to K8s via Master Node SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_MASTER_IP }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            mkdir -p ~/app-manifests
            cat << 'EOF' > ~/app-manifests/backend.yaml
            ${{ steps.manifest.outputs.content }}
            EOF
            # Replace placeholder with new tag and apply
            sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:${{ github.sha }}|g" ~/app-manifests/backend.yaml
            kubectl apply -f ~/app-manifests/backend.yaml
            kubectl rollout status deployment/fastapi-backend -n three-tier-app --timeout=120s